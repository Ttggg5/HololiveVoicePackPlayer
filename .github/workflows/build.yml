name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Publishing the build as a GitHub Release (the app updates itself from there).
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The app's signing key (a GitHub secret), so every build installs over the previous one.
      # (Checked in the script: a step's `if` can't see its own env.)
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HOLOVOICE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::HOLOVOICE_KEYSTORE_BASE64 secret not set: APKs are signed with a random debug key and can't update an installed app."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/holovoice.jks"
          echo "HOLOVOICE_KEYSTORE=$RUNNER_TEMP/holovoice.jks" >> "$GITHUB_ENV"
          echo "Signing with the app key"
      - name: Build, test and lint
        env:
          HOLOVOICE_KEYSTORE_PASSWORD: ${{ secrets.HOLOVOICE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: holovoice-0.1.${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: holovoice-0.1.${{ github.run_number }}-debug
          path: app/build/outputs/apk/debug/*.apk
      # Every pushed build signed with the app key becomes the latest GitHub Release; the app's
      # "Check for updates" downloads it from there. Only the 10 newest releases are kept.
      - name: Publish release
        if: github.event_name == 'push' && env.HOLOVOICE_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "holovoice-$V.apk"
          gh release create "v$V" "holovoice-$V.apk" --target "${{ github.sha }}" \
            --title "Holo Voice $V" --notes "$(git log -1 --pretty=%s)" --latest
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | xargs -r -n1 gh release delete --cleanup-tag -y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
