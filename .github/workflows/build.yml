name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The app's signing key (a GitHub secret), so every build installs over the previous one.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HOLOVOICE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/holovoice.jks"
          echo "HOLOVOICE_KEYSTORE=$RUNNER_TEMP/holovoice.jks" >> "$GITHUB_ENV"
      - name: Build, test and lint
        env:
          HOLOVOICE_KEYSTORE_PASSWORD: ${{ secrets.HOLOVOICE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: holovoice-0.1.${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: holovoice-0.1.${{ github.run_number }}-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
